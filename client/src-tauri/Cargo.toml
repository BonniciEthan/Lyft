[package]
name = "gym-tracker"
version = "1.0.0"
description = "Gym Tracker desktop client"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "gym-tracker"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
