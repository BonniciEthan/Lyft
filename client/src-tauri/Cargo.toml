[package]
name = "lyft"
version = "1.5.2"
description = "Lyft desktop client"
authors = ["you"]
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "lyft"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
